name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-tools-dev-tools qt6-svg-dev libgl1-mesa-dev
      - name: Build
        run: |
          mkdir build && cd build
          qmake6 ../asmon.pro
          make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: asmon-linux-x64
          path: build/asmon

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-translations
            make
      - name: Build
        run: |
          mkdir build && cd build
          qmake6 ../asmon.pro CONFIG+=release
          mingw32-make -j"$(nproc)"
      - name: Deploy Qt runtime
        run: |
          mkdir -p dist
          cp build/release/asmon.exe dist/ 2>/dev/null || cp build/asmon.exe dist/
          windeployqt6 --release --no-translations --no-system-d3d-compiler --no-opengl-sw dist/asmon.exe
          ldd dist/asmon.exe | grep -i ucrt64 | awk '{print $3}' | xargs -r -I{} cp -n {} dist/

      - name: Fetch toolchains (WinLibs MinGW-w64, llvm-mingw)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dl | Out-Null
          # WinLibs: GCC + binutils + GDB + NASM. The exact file name is read from the release.
          $assets = (gh release view $env:WINLIBS_TAG -R brechtsanders/winlibs_mingw --json assets | ConvertFrom-Json).assets
          $wl = $assets | Where-Object { $_.name -match '^winlibs-x86_64-posix-seh-gcc-[0-9.]+-mingw-w64ucrt-[0-9.]+-r[0-9]+\.zip$' } | Select-Object -First 1
          if (-not $wl) { $wl = $assets | Where-Object { $_.name -match '^winlibs-x86_64-posix-seh-gcc-.*-mingw-w64ucrt-.*\.zip$' } | Select-Object -First 1 }
          if (-not $wl) { throw "WinLibs x86_64 zip not found in $env:WINLIBS_TAG" }
          Write-Host "WinLibs: $($wl.name) ($([math]::Round($wl.size/1MB)) MB)"
          gh release download $env:WINLIBS_TAG -R brechtsanders/winlibs_mingw -p $wl.name -D dl
          7z x "dl\$($wl.name)" -odl\winlibs -y | Out-Null
          Move-Item dl\winlibs\mingw64 dist\MinGW64
          "WinLibs: $($wl.name) (release $env:WINLIBS_TAG)" | Out-File -Encoding utf8 dl\versions.txt
          # 32-bit toolchain (optional installer component): the i686 edition of the same release
          $wl32 = $assets | Where-Object { $_.name -match '^winlibs-i686-posix-dwarf-gcc-[0-9.]+-mingw-w64ucrt-[0-9.]+-r[0-9]+\.zip$' } | Select-Object -First 1
          if (-not $wl32) { $wl32 = $assets | Where-Object { $_.name -match '^winlibs-i686-.*-mingw-w64ucrt-[0-9.]+-r[0-9]+\.zip$' } | Select-Object -First 1 }
          if (-not $wl32) { throw "WinLibs i686 zip not found in $env:WINLIBS_TAG" }
          Write-Host "WinLibs 32-bit: $($wl32.name) ($([math]::Round($wl32.size/1MB)) MB)"
          gh release download $env:WINLIBS_TAG -R brechtsanders/winlibs_mingw -p $wl32.name -D dl
          7z x "dl\$($wl32.name)" -odl\winlibs32 -y | Out-Null
          Move-Item dl\winlibs32\mingw32 dist\MinGW
          "WinLibs 32-bit: $($wl32.name)" | Out-File -Append -Encoding utf8 dl\versions.txt
          # llvm-mingw: ld.lld (Linux ELF without WSL), llvm-objdump, lldb
          $lm = "llvm-mingw-$env:LLVM_MINGW_TAG-ucrt-x86_64.zip"
          gh release download $env:LLVM_MINGW_TAG -R mstorsjo/llvm-mingw -p $lm -D dl
          7z x "dl\$lm" -odl\llvm -y | Out-Null
          Move-Item (Get-ChildItem dl\llvm -Directory | Select-Object -First 1).FullName dist\LLVM
          "llvm-mingw: $lm" | Out-File -Append -Encoding utf8 dl\versions.txt
        env:
          GH_TOKEN: ${{ github.token }}
          WINLIBS_TAG: 16.2.0posix-23.1.3-14.0.0-ucrt-r3
          LLVM_MINGW_TAG: "20261104"

      - name: Assemble the Asmon layout
        run: |
          set -e
          T=dist/MinGW64/bin
          # extras WinLibs ships that an assembly IDE does not need
          for x in cmake ctest cpack ccmake doxygen cppcheck cppcheck-htmlreport ninja premake5 ccache ctags readtags yasm vsyasm ytasm; do
            rm -f "$T/$x.exe"
          done
          rm -rf dist/MinGW64/share/cmake-* dist/MinGW64/share/doc/doxygen dist/MinGW64/share/cppcheck
          # trim what an assembly IDE does not use (sizes measured on the r3 build)
          G=dist/MinGW64/libexec/gcc/x86_64-w64-mingw32
          rm -f $G/*/f951.exe $G/*/cc1obj.exe $G/*/cc1objplus.exe $G/*/lto1.exe   # Fortran, Obj-C, LTO (~150 MB)
          rm -f "$T/gfortran.exe" "$T/x86_64-w64-mingw32-gfortran.exe" "$T"/libgfortran*.dll dist/MinGW64/lib/libgfortran*
          rm -rf dist/MinGW64/share/man dist/MinGW64/share/info dist/MinGW64/share/locale
          # the same trimming for the 32-bit toolchain
          T32=dist/MinGW/bin
          for x in cmake ctest cpack ccmake doxygen cppcheck cppcheck-htmlreport ninja premake5 ccache ctags readtags yasm vsyasm ytasm nasm ndisasm gfortran i686-w64-mingw32-gfortran; do
            rm -f "$T32/$x.exe"
          done
          rm -f "$T32"/libgfortran*.dll dist/MinGW/lib/libgfortran*
          rm -rf dist/MinGW/share/cmake-* dist/MinGW/share/doc dist/MinGW/share/cppcheck dist/MinGW/share/man dist/MinGW/share/info dist/MinGW/share/locale
          G32=dist/MinGW/libexec/gcc/i686-w64-mingw32
          rm -f $G32/*/f951.exe $G32/*/cc1obj.exe $G32/*/cc1objplus.exe $G32/*/lto1.exe
          # LLVM: keep only ld.lld, llvm-objdump and lldb (+ the DLLs they load); drop clang,
          # its headers and the ARM/i686 sysroots (~530 MB)
          L=dist/LLVM
          mkdir -p keep-llvm/bin
          for f in ld.lld.exe llvm-objdump.exe lldb.exe lldb-server.exe lldb-dap.exe lldb-argdumper.exe; do
            [ -f "$L/bin/$f" ] && cp "$L/bin/$f" keep-llvm/bin/
          done
          cp "$L"/bin/*.dll keep-llvm/bin/
          [ -d "$L/python" ] && cp -r "$L/python" keep-llvm/
          cp "$L"/LICENSE* keep-llvm/ 2>/dev/null || true
          rm -rf "$L" && mv keep-llvm "$L"
          mkdir -p dist/NASM
          cp "$T/nasm.exe" dist/NASM/
          cp "$T/ndisasm.exe" dist/NASM/ 2>/dev/null || true
          "$T/gcc.exe" -c -O2 -g Windows/NASM/macro_win.c -o dist/NASM/macro64.o
          dist/MinGW/bin/gcc.exe -c -O2 -g Windows/NASM/macro_win.c -o dist/NASM/macro.o
          cp -r Windows/include Windows/Projects Windows/FASM dist/
          cp Windows/keys.ini dist/
          mkdir -p dist/licenses
          cp COPYING dist/licenses/Asmon-GPL-3.0.txt
          cp Windows/license.txt dist/licenses/SASM-license.txt
          du -sh dist dist/* | sort -h | tail -15
          {
            echo "Asmon build $(date -u +%Y-%m-%d), commit $GITHUB_SHA"
            cat dl/versions.txt | tr -d '\r'
            dist/NASM/nasm.exe -v
            "$T/gcc.exe" --version | head -1
            "$T/gdb.exe" --version | head -1
            dist/MinGW/bin/gcc.exe --version | head -1
            dist/LLVM/bin/ld.lld.exe --version
          } | tee dist/licenses/VERSIONS.txt

      - name: Smoke test (build and run the templates with the bundled tools)
        run: |
          set -e
          mkdir -p smoke && cd smoke
          N="../dist/NASM/nasm.exe -w-implicit-abs-deprecated"; G=../dist/MinGW64/bin/gcc.exe
          # same link flags as Asmon's default (gccbasedassembler.cpp)
          L="-Wl,--image-base,0x400000 -Wl,--disable-dynamicbase -Wl,--disable-high-entropy-va"
          # 1) io64.inc + macro64.o, the way Asmon builds x64 programs
          $N -I ../dist/include/ -f win64 ../templates/hello_win64.asm -l a.lst -o a.o
          $G a.o ../dist/NASM/macro64.o -g -o a.exe -m64 $L
          ./a.exe | tee a.txt; grep -q "Hello, world!" a.txt
          # 2) Windows API directly
          $N -f win64 ../templates/hello_win64_api.asm -o b.o
          $G b.o -g -o b.exe -m64 $L
          ./b.exe | tee b.txt; grep -q "Hello, world!" b.txt
          # 3) Linux ELF without WSL (ld.lld), check the ELF magic
          $N -f elf64 -g -F dwarf ../templates/hello_linux64.asm -o c.o
          ../dist/LLVM/bin/ld.lld.exe -e main -o c.elf c.o
          head -c 4 c.elf | od -c | head -1 | grep -q "E   L   F"
          # 4) input via io64.inc (GET_DEC) from a redirected file
          printf '%s\n' '%include "io64.inc"' 'section .text' 'global main' 'main:' '    mov rbp, rsp' '    GET_DEC 8, rax' '    add rax, 1' '    PRINT_DEC 8, rax' '    NEWLINE' '    xor rax, rax' '    ret' > d.asm
          $N -I ../dist/include/ -f win64 d.asm -o d.o
          $G d.o ../dist/NASM/macro64.o -g -o d.exe -m64 $L
          echo 41 | ./d.exe | tee d.txt; grep -q "42" d.txt
          # 5) x86 (32-bit toolchain): io.inc + macro.o, Asmon's x86 options
          printf '%s\n' '%include "io.inc"' 'section .data' 'msg db "Hello, x86!", 0' 'section .text' 'global main' 'main:' '    mov ebp, esp' '    PRINT_STRING msg' '    NEWLINE' '    GET_DEC 4, eax' '    add eax, 1' '    PRINT_DEC 4, eax' '    NEWLINE' '    xor eax, eax' '    ret' > e.asm
          ../dist/NASM/nasm.exe --gprefix _ -I ../dist/include/ -f win32 e.asm -l e.lst -o e.o
          ../dist/MinGW/bin/gcc.exe e.o ../dist/NASM/macro.o -g -o e.exe -m32
          file e.exe 2>/dev/null || true
          echo 6 | ./e.exe | tee e.txt; grep -q "Hello, x86!" e.txt; grep -q "^7" e.txt
          # 6) GAS (x64, Intel syntax), Asmon's GAS options
          printf '%s\n' '.intel_syntax noprefix' '.data' 'msg: .asciz "Hello from GAS"' '.text' '.global main' 'main:' '    sub rsp, 40' '    lea rcx, [rip + msg]' '    call puts' '    add rsp, 40' '    xor eax, eax' '    ret' > g.s
          ../dist/MinGW64/bin/as.exe g.s -o g.o --64 -a=g.lst
          $G g.o ../dist/NASM/macro64.o -g -o g.exe -m64 $L
          ./g.exe | tee g.txt; grep -q "Hello from GAS" g.txt
          # 7) GAS x86 (AT&T syntax) with the 32-bit toolchain
          printf '%s\n' '.data' 'msg: .asciz "Hello from GAS x86"' '.text' '.global _main' '_main:' '    pushl $msg' '    call _puts' '    addl $4, %esp' '    xorl %eax, %eax' '    ret' > h.s
          ../dist/MinGW/bin/as.exe h.s -o h.o --32 -a=h.lst
          ../dist/MinGW/bin/gcc.exe h.o ../dist/NASM/macro.o -g -o h.exe -m32
          ./h.exe | tee h.txt; grep -q "Hello from GAS x86" h.txt
          # 8) FASM (bundled fasm.exe), x64 COFF object linked by MinGW
          printf '%s\r\n' 'format MS64 COFF' 'extrn puts' "section '.text' code readable executable" 'public main' 'main:' '    sub rsp, 40' '    lea rcx, [msg]' '    call puts' '    add rsp, 40' '    xor eax, eax' '    ret' "section '.data' data readable writeable" "msg db 'Hello from FASM', 0" > f.asm
          ../dist/FASM/fasm.exe f.asm f.o
          $G f.o ../dist/NASM/macro64.o -g -o f.exe -m64 $L
          ./f.exe | tee f.txt; grep -q "Hello from FASM" f.txt
          # 9) FASM x86 (MS COFF) with the 32-bit toolchain
          printf '%s\r\n' 'format MS COFF' 'extrn _puts' "section '.text' code readable executable" 'public _main' '_main:' '    push msg' '    call _puts' '    add esp, 4' '    xor eax, eax' '    ret' "section '.data' data readable writeable" "msg db 'Hello from FASM x86', 0" > k.asm
          ../dist/FASM/fasm.exe k.asm k.o
          ../dist/MinGW/bin/gcc.exe k.o ../dist/NASM/macro.o -g -o k.exe -m32
          ./k.exe | tee k.txt; grep -q "Hello from FASM x86" k.txt
          # 10) the 32-bit gdb runs
          ../dist/MinGW/bin/gdb.exe --batch -ex "info files" e.exe | head -5
          echo "SMOKE TEST PASSED"

      - name: GUI test on the runner's desktop (screenshots)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png")
          }
          Copy-Item tests\debug_crash_test.asm "$env:RUNNER_TEMP\test.asm"
          $p = Start-Process -FilePath dist\asmon.exe -ArgumentList "$env:RUNNER_TEMP\test.asm" -PassThru
          Start-Sleep 15
          if ($p.HasExited) { throw "asmon.exe exited at startup with code $($p.ExitCode)" }
          Shot "1-start"
          $ws = New-Object -ComObject WScript.Shell
          $null = $ws.AppActivate($p.Id); Start-Sleep 2
          $ws.SendKeys("{F9}"); Start-Sleep 15          # build and run: prints, then crashes
          Shot "2-build-and-run"
          $ws.SendKeys("{F5}"); Start-Sleep 20          # debug: stops at the first line of main
          $ws.SendKeys("{F10}"); Start-Sleep 4
          $ws.SendKeys("{F10}"); Start-Sleep 4
          $ws.SendKeys("{F10}"); Start-Sleep 4
          Shot "3-debug-steps"
          $ws.SendKeys("{F5}"); Start-Sleep 10          # continue to the crash
          Shot "4-debug-crash"
          if ($p.HasExited) { throw "asmon.exe crashed during the test" }
          Stop-Process -Id $p.Id -Force
          Get-ChildItem shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-gui-screenshots
          path: shots

      - uses: actions/upload-artifact@v4
        with:
          name: asmon-windows-x64
          path: dist

  wsl:
    # Linux programs on Windows: build an ELF with the bundled NASM + ld.lld, run and
    # debug it in a real WSL distribution (installed by setup-wsl), from Asmon's GUI.
    needs: windows
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: asmon-windows-x64
          path: dist
      - uses: Vampire/setup-wsl@v6
        with:
          additional-packages: gdb
      - name: WSL basics (what Asmon checks and runs)
        shell: pwsh
        run: |
          wsl.exe --list --verbose
          wsl.exe --exec sh -c "command -v gdb && gdb --version | head -1"
          New-Item -ItemType Directory -Force w | Out-Null
          dist\NASM\nasm.exe -f elf64 -g -F dwarf templates\hello_linux64.asm -l w\program.lst -o w\program.o
          dist\LLVM\bin\ld.lld.exe -e main -o w\AsmonProg.exe w\program.o
          $out = wsl.exe --cd "$PWD\w" --exec ./AsmonProg.exe
          Write-Host "program output: $out"
          if ("$out" -notmatch "Hello, world!") { throw "the ELF did not run in WSL" }
          # gdb inside WSL, the way Asmon starts it (MI on stdin/stdout)
          wsl.exe --cd "$PWD\w" --exec gdb --batch -nx -ex "break *main" -ex run -ex "info registers rip" -ex "stepi" -ex "info registers rip" ./AsmonProg.exe
      - name: GUI test (Linux target, run and debug through WSL)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots, dist\data\Asmon | Out-Null
          Set-Content dist\portable ""
          Set-Content dist\data\Asmon\Asmon.ini "[General]`r`ntarget=linux`r`n"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png")
          }
          Copy-Item templates\hello_linux64.asm "$env:RUNNER_TEMP\hello_linux.asm"
          $p = Start-Process -FilePath dist\asmon.exe -ArgumentList "$env:RUNNER_TEMP\hello_linux.asm" -PassThru
          Start-Sleep 15
          if ($p.HasExited) { throw "asmon.exe exited at startup" }
          $ws = New-Object -ComObject WScript.Shell
          $null = $ws.AppActivate($p.Id); Start-Sleep 2
          $ws.SendKeys("{F9}"); Start-Sleep 20
          Shot "wsl-1-run"
          $ws.SendKeys("{F5}"); Start-Sleep 30
          Shot "wsl-2-debug-start"
          $ws.SendKeys("{F10}"); Start-Sleep 5
          $ws.SendKeys("{F10}"); Start-Sleep 5
          $ws.SendKeys("{F10}"); Start-Sleep 5
          $ws.SendKeys("{F10}"); Start-Sleep 5
          $ws.SendKeys("{F10}"); Start-Sleep 5
          Shot "wsl-3-after-syscall"
          $ws.SendKeys("{F5}"); Start-Sleep 10
          Shot "wsl-4-finished"
          if ($p.HasExited) { throw "asmon.exe crashed during the test" }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wsl-screenshots
          path: shots

  re-tools:
    # External RE tools for the "RE" menu, packed as optional installer components.
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download Ghidra, JDK, Cutter, x64dbg, ImHex (official releases)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dl, tools | Out-Null
          function Get-Asset($repo, $pattern) {
            $rel = gh release view -R $repo --json tagName,assets | ConvertFrom-Json
            $a = $rel.assets | Where-Object { $_.name -match $pattern } | Select-Object -First 1
            if (-not $a) { throw "No asset matching $pattern in $repo $($rel.tagName)" }
            Write-Host "$repo $($rel.tagName): $($a.name) ($([math]::Round($a.size/1MB)) MB)"
            "$repo $($rel.tagName): $($a.name)" | Out-File -Append -Encoding utf8 tools\VERSIONS-re.txt
            gh release download $rel.tagName -R $repo -p $a.name -D dl --clobber
            return "dl\$($a.name)"
          }
          # extract; if the archive holds a single top folder, use its contents
          function Expand-Tool($zip, $name) {
            $tmp = "dl\x-$name"
            7z x $zip "-o$tmp" -y | Out-Null
            $items = @(Get-ChildItem $tmp)
            if ($items.Count -eq 1 -and $items[0].PSIsContainer) { Move-Item $items[0].FullName "tools\$name" }
            else { Move-Item $tmp "tools\$name" }
          }
          Expand-Tool (Get-Asset 'NationalSecurityAgency/ghidra' '^ghidra_.*_PUBLIC_\d+\.zip$') 'ghidra'
          Expand-Tool (Get-Asset 'adoptium/temurin21-binaries' '^OpenJDK21U-jdk_x64_windows_hotspot_.*\.zip$') 'jdk'
          Expand-Tool (Get-Asset 'rizinorg/cutter' '^Cutter-v.*-Windows-x86_64\.zip$') 'cutter'
          Expand-Tool (Get-Asset 'x64dbg/x64dbg' '^snapshot_.*\.zip$') 'x64dbg'
          Expand-Tool (Get-Asset 'WerWolv/ImHex' '^imhex-.*-Windows-Portable-x86_64\.zip$') 'imhex'
          Write-Host "--- launchers"
          Get-ChildItem tools\ghidra\ghidraRun.bat, tools\jdk\bin\java.exe | ForEach-Object { $_.FullName }
          Get-ChildItem -Recurse tools\cutter, tools\x64dbg, tools\imhex -Include cutter.exe, x64dbg.exe, x32dbg.exe, imhex*.exe | ForEach-Object { $_.FullName }
          & tools\jdk\bin\java.exe -version
          Write-Host "--- sizes (MB)"
          Get-ChildItem tools -Directory | ForEach-Object {
            $mb = [math]::Round((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
            Write-Host "$($_.Name): $mb"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: asmon-re-tools-windows
          path: tools

  installer:
    # Inno Setup installer with components + portable zips; a GitHub release for v* tags.
    needs: [windows, re-tools]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: asmon-windows-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: asmon-re-tools-windows
          path: retools
      - name: Build installer and portable packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { "0.1.0-dev" }
          "ASMON_VERSION=$ver" >> $env:GITHUB_ENV
          Get-Content retools\VERSIONS-re.txt | Add-Content dist\licenses\VERSIONS.txt
          Remove-Item retools\VERSIONS-re.txt
          Get-Content dist\licenses\VERSIONS.txt
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc /Q "/DAppVersion=$ver" /DDist=..\dist /DReTools=..\retools installer\asmon.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          # portable: settings stay next to asmon.exe (data\Asmon\Asmon.ini)
          New-Item dist\portable -ItemType File -Force | Out-Null
          Copy-Item THIRD_PARTY.md dist\licenses\
          7z a -tzip -mx=7 "installer\output\Asmon-$ver-portable.zip" .\dist\* | Out-Null
          # RE tools for the portable version: extract into Asmon\tools
          7z a -tzip -mx=7 "installer\output\Asmon-$ver-RE-tools-portable.zip" .\retools\* | Out-Null
          Get-ChildItem installer\output | ForEach-Object { "{0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }
      - name: Install silently and smoke-test the installed copy
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer\output\Asmon-*-Setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TYPE=full','/DIR=C:\AsmonTest' -Wait
          foreach ($f in 'asmon.exe','NASM\nasm.exe','NASM\macro.o','MinGW64\bin\gcc.exe','MinGW64\bin\gdb.exe','MinGW\bin\gcc.exe','MinGW\bin\gdb.exe','LLVM\bin\ld.lld.exe','tools\ghidra\ghidraRun.bat','tools\jdk\bin\java.exe') {
            if (-not (Test-Path "C:\AsmonTest\$f")) { throw "missing after install: $f" }
            Write-Host "ok  $f"
          }
          # RE menu: open the built program in each tool from Asmon (command palette), check the
          # tool's process starts, take screenshots
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png")
          }
          Copy-Item templates\hello_win64.asm "$env:RUNNER_TEMP\hello.asm"
          $p = Start-Process C:\AsmonTest\asmon.exe -ArgumentList "$env:RUNNER_TEMP\hello.asm" -PassThru; Start-Sleep 15
          if ($p.HasExited) { throw "installed asmon.exe exited with code $($p.ExitCode)" }
          $ws = New-Object -ComObject WScript.Shell
          $results = @()
          foreach ($t in @(@('x64dbg','x64dbg'), @('Cutter','cutter'), @('ImHex','imhex*'), @('Ghidra','java*'))) {
            $null = $ws.AppActivate($p.Id); Start-Sleep 2
            $ws.SendKeys("^+p"); Start-Sleep 2
            $ws.SendKeys("open program in $($t[0])"); Start-Sleep 2
            $ws.SendKeys("{ENTER}"); Start-Sleep 40
            Shot "re-$($t[0])"
            $proc = Get-Process -Name $t[1] -ErrorAction SilentlyContinue
            $results += "$($t[0]): " + $(if ($proc) { "started ($($proc[0].ProcessName))" } else { "NOT started" })
            $proc | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep 3
          }
          $results | ForEach-Object { Write-Host $_ }
          if ($p.HasExited) { throw "asmon.exe exited during the RE test" }
          Stop-Process -Id $p.Id -Force
          if ($results -match 'NOT started') { Write-Host "::warning::some RE tools did not start: $($results -join '; ')" }
          Start-Process C:\AsmonTest\unins000.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          Start-Sleep 5
          if (Test-Path C:\AsmonTest\asmon.exe) { throw "uninstall left asmon.exe behind" }
          Write-Host "install / run / uninstall OK"
      - name: Installer pages (interactive run, screenshots, then cancelled)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png")
          }
          $setup = Get-ChildItem installer\output\Asmon-*-Setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/LANG=he','/CURRENTUSER' -PassThru
          Start-Sleep 15
          $ws = New-Object -ComObject WScript.Shell
          for ($i = 1; $i -le 5; $i++) {
            Get-Process | Where-Object { $_.MainWindowTitle -match 'Asmon|אסמון' } | ForEach-Object { $null = $ws.AppActivate($_.Id) }
            Start-Sleep 2
            Shot "installer-page-$i"
            if ($i -lt 5) { $ws.SendKeys("{ENTER}"); Start-Sleep 4 }
          }
          Get-Process | Where-Object { $_.ProcessName -match '^Asmon.*Setup|^Setup|\.tmp$|^is-' } | Stop-Process -Force -ErrorAction SilentlyContinue
          $p | Stop-Process -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-screenshots
          path: shots
      - uses: actions/upload-artifact@v4
        with:
          name: asmon-installer-and-portable
          path: installer/output
          compression-level: 0
      - name: Attach to the GitHub release (v* tags / published releases)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $files = (Get-ChildItem installer\output\*).FullName
          gh release view $env:GITHUB_REF_NAME -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            # release made in the GitHub UI: add the files to it
            gh release upload $env:GITHUB_REF_NAME $files --clobber -R $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:GITHUB_REF_NAME $files --prerelease --title "Asmon $env:ASMON_VERSION" --notes-file installer\RELEASE_NOTES.md -R $env:GITHUB_REPOSITORY
          }
