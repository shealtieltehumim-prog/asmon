name: toolchain-diag
# Manual diagnostic: do the bundled WinLibs tools start with a PATH that holds only the Windows folders?
on: workflow_dispatch
jobs:
  diag:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      WINLIBS_TAG: 16.2.0posix-23.1.3-14.0.0-ucrt-r3
    steps:
      - name: Get WinLibs x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = (gh release view $env:WINLIBS_TAG -R brechtsanders/winlibs_mingw --json assets | ConvertFrom-Json).assets
          $wl = $assets | Where-Object { $_.name -match '^winlibs-x86_64-posix-seh-gcc-[0-9.]+-mingw-w64ucrt-[0-9.]+-r[0-9]+\.zip$' } | Select-Object -First 1
          gh release download $env:WINLIBS_TAG -R brechtsanders/winlibs_mingw -p $wl.name -D dl
          7z x "dl\$($wl.name)" -odl\winlibs -y | Out-Null
          Move-Item dl\winlibs\mingw64 C:\MinGW64
      - name: Run each tool with a clean PATH
        shell: pwsh
        run: |
          $objdump = "C:\MinGW64\bin\objdump.exe"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($t in 'nasm','gcc','as','ld','gdb','objdump') {
            $exe = "C:\MinGW64\bin\$t.exe"
            Write-Host "=== $t"
            & $objdump -p $exe | Select-String 'DLL Name' | ForEach-Object { $_.Line.Trim() }
            try { & $exe --version 2>&1 | Select-Object -First 1; Write-Host "exit code: $LASTEXITCODE" }
            catch { Write-Host "FAILED TO START: $_" }
          }
          Write-Host "=== build hello with gcc only"
          Set-Content "$env:TEMP\h.c" 'int puts(const char*); int main(){puts("hi from clean PATH");return 0;}'
          & C:\MinGW64\bin\gcc.exe "$env:TEMP\h.c" -o "$env:TEMP\h.exe"; Write-Host "gcc exit: $LASTEXITCODE"
          & "$env:TEMP\h.exe"
